[package]
name = "framework-control-service"
version = "0.5.5"
edition = "2021"
authors = ["Framework Control"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
which = "6"
chrono = "0.4"
sysinfo = { version = "0.30", features = ["multithread"] }
poem = { version = "3.1.12" }
poem-openapi = { version = "5.1.16", features = ["swagger-ui"] }
dotenvy = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rust-embed = { version = "8", features = ["interpolate-folder-path", "include-exclude"], optional = true }
zip = { version = "0.6", default-features = false, features = ["deflate"] }
regex = "1"

# In-process EC access (see src/cli/ec_lib.rs). Pinned exactly: the adapter mirrors this release's
# CLI output and works around its driver-layer panics, so bump it deliberately.
# Default features (hidapi, rusb) are off: they pull in libudev/libusb and aren't needed for EC access.
[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
framework_lib = { version = "=0.6.6", default-features = false }
dmidecode = { version = "1", default-features = false }

[features]
default = ["embed-ui"]
embed-ui = ["dep:rust-embed"]



[package.metadata.wix]
eula = false
